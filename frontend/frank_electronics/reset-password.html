<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reset Password — Frank Electronics</title>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>

<div class="auth-topbar">
  <a class="auth-brand" href="/">
    <div class="auth-logo">
      <img src="assets/logo.png" alt="Frank Electronics" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
      <span class="auth-logo-fallback" style="display:none">FE</span>
    </div>
    <div>
      <div class="auth-brand-name">Frank Electronics</div>
      <div class="auth-brand-tag">Your plug for smart electronics</div>
    </div>
  </a>
  <span class="auth-topbar-link" style="color:#666">Step 2 of 3 — Verify code</span>
</div>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-header-icon">📬</div>
      <div class="auth-title">Enter <span>Code</span></div>
      <p class="auth-subtitle">We sent a 6-digit code to your email. Enter it below to continue.</p>
    </div>

    <div class="alert alert-error" id="resetAlert"></div>

    <div class="form-group">
      <label for="resetOtp">6-digit code</label>
      <input class="form-control" id="resetOtp" type="text" maxlength="6"
        placeholder="_ _ _ _ _ _"
        style="letter-spacing:8px;text-align:center;font-weight:700;font-size:24px;padding:16px"
        oninput="clearErr()"/>
      <div class="field-error" id="otp-error">Please enter the 6-digit code.</div>
    </div>

    <button class="btn btn-orange" onclick="doVerify()" id="verifyBtn">Verify code →</button>

    <div class="resend-row" style="margin-top:16px;text-align:center;font-size:13px;color:var(--gray-t)">
      Didn't receive it?
      <button class="resend-btn" onclick="resendCode()" style="background:none;border:none;color:var(--orange);font-weight:700;cursor:pointer;font-size:13px">Resend</button>
    </div>

    <div class="auth-bottom"><a href="/forgot">← Request new code</a></div>
  </div>
</div>

<div class="auth-footer">© 2026 Frank Electronics · <a href="/contact">Support</a></div>
<div class="toast" id="toast"></div>

<script src="backend_api.js"></script>
<script>
function clearErr() {
  document.getElementById('resetOtp').classList.remove('error');
  document.getElementById('otp-error').classList.remove('show');
  document.getElementById('resetAlert').classList.remove('show');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Check session
const email = sessionStorage.getItem('fe_reset_email');
if (!email) window.location.href = '/forgot';

async function doVerify() {
  const otp = document.getElementById('resetOtp').value.trim();

  if (!otp || otp.length !== 6) {
    document.getElementById('resetOtp').classList.add('error');
    document.getElementById('otp-error').classList.add('show');
    return;
  }

  const btn = document.getElementById('verifyBtn');
  btn.disabled = true; btn.textContent = 'Verifying...';

  // Save OTP and move to new password page
  sessionStorage.setItem('fe_reset_otp', otp);
  window.location.href = '/new-password';
}

async function resendCode() {
  if (!email) return;
  try {
    await apiCall('/api/auth/forgot-password/', 'POST', { email });
    showToast('New code sent to your email!');
  } catch(err) {
    showToast('Failed to resend. Try again.');
  }
}
</script>
</body>
</html>
